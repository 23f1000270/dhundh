name: build

on:
  push:
  pull_request:

jobs:
  core-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Core tests (no dependencies)
        run: |
          javac -d out core/src/main/java/org/dhundh/core/*.java core/src/test/java/org/dhundh/core/*.java
          java -cp out org.dhundh.core.CoreTests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simulator tests
        run: |
          pip install numpy pytest
          cd sim && pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dhundh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
